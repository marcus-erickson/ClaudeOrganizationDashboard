<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Coaching Dashboard</title>
  <meta name="description" content="See how your organization uses Claude, find coaching opportunities, and spot tasks worth turning into shared skills.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        </span>
        <span id="brand-title">Claude Coaching</span>
      </div>
      <nav id="nav" aria-label="Sections"></nav>
      <div id="data-status" class="data-status"></div>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1"></main>
  <footer class="wrap footer">
    <span>Usage numbers come from the Claude Enterprise Analytics API. Use cases come only from self-reports people chose to share.</span>
  </footer>

  <!-- Configuration and your program content -->
  <script src="config.js"></script>
  <script src="data/program.js"></script>
  <!-- Sample data, replaced by live data when data/live-data.js exists -->
  <script src="data/sample-data.js"></script>
  <script src="data/live-data.js" onerror="void 0"></script>
  <script src="app.js"></script>
</body>
</html>
